version: '3.8'

services:
  web:
    image: mi_proyecto_web:latest
    ports:
      - "80:80"
    networks:
      - red_proyecto
    deploy:
      replicas: 3

  db:
    image: redis:alpine
    networks:
      - red_proyecto
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  visualizer:
    image: dockersamples/visualizer:latest
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - red_proyecto
    deploy:
      placement:
        constraints:
          - node.role == manager

networks:
  red_proyecto:
    driver: overlay
